<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orlando Bros</title>
    <link rel="stylesheet" href="styles/menu.css">
</head>

<body>

<main class="menu">

    <div class="sky"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- PERSONAJES -->
    <div class="characters">

        <div class="character orlando">
            <div class="cap"></div>
            <div class="head">
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="nose"></div>
                <div class="mustache"></div>
            </div>

            <div class="body"></div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
        </div>

        <div class="character ulises">
            <div class="cap"></div>
            <div class="head">
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="nose"></div>
                <div class="mustache"></div>
            </div>

            <div class="body"></div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
        </div>

    </div>

    <!-- LOGO -->
    <section class="menu-content">

        <div class="logo">
            <div class="small-title">THE ABSOLUTELY NORMAL</div>

            <h1>
                <span>ORLANDO</span>
                <strong>BROS</strong>
            </h1>

            <div class="subtitle">
                una aventura bastante cuestionable
            </div>
        </div>

        <nav class="menu-buttons">

            <button class="menu-button primary" id="playButton">
                JUGAR
            </button>

            <button class="menu-button" id="levelsButton">
                NIVELES
            </button>

            <button class="menu-button" id="optionsButton">
                OPCIONES
            </button>

        </nav>

    </section>

    <div class="ground">
        <div class="grass"></div>
        <div class="dirt"></div>
    </div>

    <footer>
        ORLANDO BROS // 2026 // DEFINITIVAMENTE NO ES MARIO
    </footer>

</main>

<script>
const playButton = document.getElementById("playButton");

playButton.onclick = () => {
    location.href = "game/init.html";
};

document.getElementById("levelsButton").onclick = () => {
    alert("Todavia no hay niveles, we.");
};

document.getElementById("optionsButton").onclick = () => {
    alert("No hay opciones. Todo esta perfectamente mal.");
};
</script>

</body>
</html>
