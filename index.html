<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#080707">

    <title>ORLANDO BROS</title>

    <link rel="stylesheet" href="styles/menu.css">
</head>

<body>

<main class="menu">

    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div class="background">

        <div class="noise"></div>

        <div class="red-glow glow-left"></div>
        <div class="red-glow glow-right"></div>

        <div class="moon"></div>

        <div class="background-platform platform-one"></div>
        <div class="background-platform platform-two"></div>
        <div class="background-platform platform-three"></div>

        <div class="floating-block block-a">?</div>
        <div class="floating-block block-b">?</div>
        <div class="floating-block block-c">?</div>

    </div>


    <!-- =====================================================
         TEXTOS PERDIDOS
    ====================================================== -->

    <div class="strange-text text-one">
        NO MIRES ATRAS
    </div>

    <div class="strange-text text-two">
        ORLANDO TE ESTA MIRANDO
    </div>

    <div class="strange-text text-three">
        2 JUGADORES
    </div>

    <div class="strange-text text-four">
        ERROR 1997
    </div>


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <header class="logo-container">

        <div class="logo-warning">
            UNA EXPERIENCIA TOTALMENTE NORMAL
        </div>

        <h1 class="logo">

            <span class="logo-top">
                ORLANDO
            </span>

            <span class="logo-bottom">
                BROS
            </span>

        </h1>

        <div class="logo-under">
            <span>THE</span>
            <span>ORIGINAL</span>
            <span>PROBABLY</span>
        </div>

    </header>


    <!-- =====================================================
         ESCENARIO
    ====================================================== -->

    <section class="menu-stage">


        <!-- ORLANDO -->

        <div class="character-slot orlando-slot">

            <div class="character-label">
                ORLANDO
            </div>

            <div class="character-glitch"></div>

            <div class="sprite-wrapper orlando-wrapper">

                <img
                    class="character-sprite orlando-sprite"
                    src="assets/images/orlando.png"
                    alt="Orlando"
                >

            </div>

            <div class="character-shadow"></div>

            <div class="character-message">
                <span>...</span>
            </div>

        </div>


        <!-- =================================================
             MENU
        ================================================== -->

        <nav class="main-menu">

            <div class="menu-top-text">
                SELECCIONA TU DESTINO
            </div>

            <button
                class="menu-button play"
                onclick="location.href='game/init.html'"
            >
                <span class="button-number">01</span>
                <span class="button-text">JUGAR</span>
                <span class="button-symbol">▶</span>
            </button>


            <button class="menu-button">

                <span class="button-number">02</span>
                <span class="button-text">NIVELES</span>
                <span class="button-symbol">▶</span>

            </button>


            <button class="menu-button">

                <span class="button-number">03</span>
                <span class="button-text">OPCIONES</span>
                <span class="button-symbol">▶</span>

            </button>


            <div class="menu-bottom-warning">
                NO HAY NADA QUE CONFIGURAR
            </div>

        </nav>


        <!-- ULISES -->

        <div class="character-slot ulises-slot">

            <div class="character-label">
                ULISES
            </div>

            <div class="character-glitch"></div>

            <div class="sprite-wrapper ulises-wrapper">

                <img
                    class="character-sprite ulises-sprite"
                    src="assets/images/ulises.png"
                    alt="Ulises"
                >

            </div>

            <div class="character-shadow"></div>

            <div class="character-message">
                <span>¿?</span>
            </div>

        </div>

    </section>


    <!-- =====================================================
         SUELO
    ====================================================== -->

    <div class="ground">

        <div class="ground-top"></div>

        <div class="ground-body">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


    <!-- =====================================================
         DECORACION
    ====================================================== -->

    <div class="pixel-object object-one"></div>
    <div class="pixel-object object-two"></div>

    <div class="screen-corner corner-top"></div>
    <div class="screen-corner corner-bottom"></div>

    <div class="scanlines"></div>

    <div class="version">
        ORLANDO BROS // BUILD 0.0.7
    </div>

</main>

</body>
</html>
